# PR마다 단위 테스트와 디버그 빌드를 돌린다 (#109)
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# 같은 PR·브랜치에 새 커밋이 올라오면 이전 실행을 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: 테스트·디버그 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # 저장소의 gradlew 는 CRLF 줄바꿈에 실행 권한 없이 저장돼 있어 리눅스에서 그대로는 실행되지 않는다
      - name: gradlew 실행 준비
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: 단위 테스트와 디버그 빌드
        run: ./gradlew :engine:test :core:test :app:assembleDebug

      - name: 실패한 테스트 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: android/*/build/reports/tests/
          if-no-files-found: ignore
